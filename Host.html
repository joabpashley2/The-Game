<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="CardsCss.css">
        <title> The Card Game </title>
    </head>
    <body>
<div id="game-box">
    <div id="field-and-descriptory">
        <div id="score">
            <div id="player1-score">
                <p id="player1-name" class="important">Player1</p>
                <br>
                <p>Banners: </p>
                <p id="player1-banners">5</p>
                <br>
                <p>Health: </p>
                <p id="player1-health">1000</p>
            </div>
            <div id="player2-score">
                <p id="player2-name" class="important">Player2</p>
                <br>
                <p>Banners: </p>
                <p id="player2-banners">5</p>
                <br>
                <p>Health: </p>
                <p id="player2-health">1000</p>
            </div>
        </div>
        <div id="descriptory">
            <p>descriptory</p>
        </div>

        <div id="field">
            <div id="player1-field">
                <div id="p1-card-zone1">
                    <button>Card 1</button>
                </div>
                <div id="p1-card-zone2">
                    <button>Card 2</button>
                </div>
                <div id="p1-card-zone3">
                    <button>Card 3</button>
                </div>
                <div id="p1-card-zone4">
                    <button>Card 4</button>
                </div>
                <div id="p1-card-zone5">
                    <button>Card 5</button>
                </div>
                <div id="p1-card-zone6">
                    <button>Card 6</button>
                </div>
            </div>
            <div id="player2-field">
                <div id="p2-card-zone1">
                    <button>Card 1</button>
                </div>
                <div id="p2-card-zone2">
                    <button>Card 2</button>
                </div>
                <div id="p2-card-zone3">
                    <button>Card 3</button>
                </div>
                <div id="p2-card-zone4">
                    <button>Card 4</button>
                </div>
                <div id="p2-card-zone5">
                    <button>Card 5</button>
                </div>
                <div id="p2-card-zone6">
                    <button>Card 6</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="hand-and-core-and-champions">
            <div id="core">
                <button>core</button>
            </div>

        <div id="champions">
            <div id="p1-champion">
                <button>champion1</button>
            </div>
            <div id="p2-champion">
                <button>champion2</button>
            </div>
        </div>
    
        <div id="hand">
                <div id="p2-hand-zone1">
                    <button>Card 1</button>
                </div>
                <div id="p2-hand-zone2">
                    <button>Card 2</button>
                </div>
                <div id="p2-hand-zone3">
                    <button>Card 3</button>
                </div>
                <div id="p2-hand-zone4">
                    <button>Card 4</button>
                </div>
                <div id="p2-hand-zone5">
                    <button>Card 5</button>
                </div>
                <div id="p2-hand-zone6">
                    <button>Card 6</button>
                </div>
        </div> 

    </div>
</div>
<script src="CardsPlaying.js"></script>
    </body>
</html>
